# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.3.0"
  cowsay_wasm: wasmer-test-files/integration/wasm/cowsay.wasm

package:
  name: wasmer
  version: ${{ version }}

source:
  url: https://github.com/wasmerio/wasmer/releases/download/v${{ version }}/wasmer-full-source.tar.gz
  sha256: 8855338e5c806ece263202874f94a495b7b22f34570905028e3c02a10d8fb985

build:
  number: 0
  script:
    env:
      DEFAULT_FEATURES: |-
        wasm-c-api,wasmer-artifact-create,static-artifact-create,wasmer-artifact-load,static-artifact-load,v8
    file: build-wasmer

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    # can use auditable due to:
    #     cargo metadata failure: error: package `wasmer-c-api v7.3.0 ($SRC_DIR/lib/c-api)` does not have feature `wasmer-compiler-cranelift`
    #     help: an optional dependency with that name exists, but the `features` table includes it with the "dep:" syntax so it does not have an implicit feature with that name
    #     Dependency `wasmer-compiler-cranelift` would be enabled by these features:
    #     	- cranelift
    # - cargo-auditable
    - cargo-bundle-licenses
    - pkg-config
  host:
    - libffi
    - openssl
    - zlib
    - if: linux
      then:
        - clangdev
        - libxkbcommon
        - libxml2-devel
        - llvm-tools
        - llvmdev
        - zstd
  run:
    - if: linux
      then:
        - zstd

tests:
  - files:
      recipe:
        - run_test.py
      source:
        - ${{ cowsay_wasm }}
    requirements:
      run:
        - pytest
    script:
      env:
        COWSAY_WASM: ${{ cowsay_wasm }}
      content:
        - wasmer --version
        - wasmer --help
        - wasmer run --help
        - python run_test.py

about:
  license: MIT
  summary: Universal WebAssembly runtime
  description: |
    Wasmer is a standalone JIT WebAssembly runtime, aiming to be fully
    compatible with WASI and Emscripten.
  license_file:
    - LICENSE
    - THIRDPARTY.yml
    - docs/ATTRIBUTIONS.md
  homepage: https://wasmer.io
  repository: https://github.com/wasmerio/wasmer
  documentation: https://docs.wasmer.io

extra:
  recipe-maintainers:
    - bollwyvl
    - wolfv
